<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Mayomi: Semangatttt! ❤️</title>
    <!-- Memuat ikon FontAwesome untuk hati --><script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Menggunakan font Poppins yang modern dan bersih */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            /* Gradient sunset pink-ungu yang lebih soft */
            background: linear-gradient(135deg, #fce4ec 0%, #e0c3fc 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden; /* Penting untuk animasi hati */
            position: relative; /* Untuk posisi hati */
        }

        .container {
            background-color: rgba(255, 255, 255, 0.98); /* Lebih putih & solid */
            backdrop-filter: blur(10px); /* Blur lebih kuat */
            padding: 40px;
            border-radius: 25px;
            /* Shadow yang lebih mendalam dan lembut */
            box-shadow: 0 20px 50px rgba(173, 216, 230, 0.6), 0 0 0 10px rgba(255, 255, 255, 0.5); 
            max-width: 90vw;
            width: 650px; /* Lebar container */
            transition: all 0.5s ease;
            border: 2px solid #ffb6c1; /* Border pink muda */
            z-index: 10; /* Pastikan di atas animasi hati */
            position: relative;
        }

        header h1 {
            color: #d81b60; /* Pink gelap yang romantis */
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            /* Efek teks glow lembut */
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.3); 
        }

        header p {
            color: #888;
            font-weight: 300;
            margin-bottom: 30px;
            font-style: italic;
        }

        .message-box {
            min-height: 200px; /* Sedikit lebih tinggi */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 15px;
            background: linear-gradient(145deg, #fff0f5 0%, #ffebee 100%); /* Gradient soft pink */
            margin-bottom: 25px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05); /* Shadow ke dalam */
        }

        .typing-text {
            color: #6a0572; /* Ungu gelap yang elegan */
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.8;
            min-height: 40px;
            border-right: 3px solid #ff69b4; 
            overflow: hidden;
            width: 100%; 
            margin: 10px 0;
            padding-right: 5px;
            text-align: center;
        }

        .typing-line {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap; 
            border-right: 3px solid #ff69b4;
            animation: blink-caret 0.75s step-end infinite;
            max-width: 100%; 
        }
        
        .hidden {
            opacity: 0;
            transition: opacity 1s ease, height 1s ease;
            height: 0;
            overflow: hidden;
        }
        
        /* Gaya Tombol Semangat */
        .cta-button {
            background-color: #ff69b4; /* Hot Pink */
            color: white;
            border: none;
            padding: 15px 35px; /* Lebih besar */
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
            margin-top: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .cta-button:hover {
            background-color: #d33c7c;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.8);
        }

        footer {
            margin-top: 35px;
        }

        footer p {
            color: #a0a0a0;
            font-weight: 300;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* --- Animasi Hati --- */
        .heart {
            position: absolute;
            bottom: -20px; /* Mulai dari bawah layar */
            font-size: 1.5rem;
            color: #ffb6c1; /* Pink lembut */
            animation: fly-up 10s linear infinite; /* Animasi terbang ke atas */
            opacity: 0;
            pointer-events: none; /* Agar tidak menghalangi klik */
            z-index: 5; /* Di bawah container */
        }

        @keyframes fly-up {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            80% {
                transform: translateY(-1000px) scale(1.5); /* Terbang tinggi */
                opacity: 0.8;
            }
            100% {
                transform: translateY(-1200px) scale(2);
                opacity: 0;
            }
        }

        /* Animasi berdetak */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Animasi cursor mengetik */
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #ff69b4; }
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
                width: 95vw; 
            }
            header h1 {
                font-size: 2rem;
            }
            .typing-text {
                font-size: 1.1rem;
            }
            .cta-button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mayomi Semangatttt! <i class="fas fa-heart" style="color:#ff69b4;"></i></h1>
            <p>Pesan ini dibuat khusus untuk kamu, Partner In Crime-ku!</p>
        </header>
        
        <div class="message-box">
            <p id="msg1" class="typing-text"></p>
            <p id="msg2" class="typing-text hidden"></p>
            <p id="msg3" class="typing-text hidden"></p>
        </div>

        <button class="cta-button" onclick="showFinalMessage()">
            <i class="fas fa-hand-holding-heart"></i> Klik Untuk Tambahan Semangat!
        </button>

        <footer>
            <p>Dibuat oleh *sidekick*-mu, yang siap *back-up* kapan saja.</p>
        </footer>
    </div>

    <script>
        // Pesan-pesan penyemangat yang akan muncul secara bergantian
        const messages = [
            "Stop! HP kamu terdeteksi sedang galau, dan itu bukan karena *password* Wi-Fi! 😠",
            "Mantan itu cuma *trailer* film yang udah *flop*, Sayang. Kenapa nonton *trailer* terus kalau *movie* utama kita baru mau tayang?",
            "Yuk, balik badan! Fokus ke *upgrade* diri. Yang terbaik itu ada di depan, bukan di riwayat *chat* yang lalu. Aku di sini lho!",
        ];

        const messageElements = [
            document.getElementById('msg1'),
            document.getElementById('msg2'),
            document.getElementById('msg3'),
        ];

        let messageIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (messageIndex < messages.length) {
                const currentMessage = messages[messageIndex];
                const currentElement = messageElements[messageIndex];
                
                if (!currentElement.querySelector('.typing-line')) {
                    currentElement.innerHTML = '<span class="typing-line"></span>';
                }
                const typingLine = currentElement.querySelector('.typing-line');
                
                if (charIndex < currentMessage.length) {
                    currentElement.classList.remove('hidden');
                    typingLine.textContent += currentMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 40); 
                } else {
                    typingLine.classList.remove('typing-line');
                    typingLine.style.borderRight = 'none';
                    typingLine.style.animation = 'none';
                    currentElement.textContent = currentMessage; 
                    
                    charIndex = 0;
                    messageIndex++;
                    
                    if (messageIndex < messages.length) {
                        setTimeout(() => {
                            typeWriter();
                        }, 1800); 
                    }
                }
            }
        }

        function showFinalMessage() {
            const button = document.querySelector('.cta-button');
            const messageBox = document.querySelector('.message-box');
            
            messageBox.innerHTML = ''; 

            const finalMsg = document.createElement('p');
            finalMsg.className = 'typing-text';

            const typingLine = document.createElement('span');
            typingLine.className = 'typing-line';
            typingLine.style.borderRight = '3px solid #ff69b4';
            typingLine.style.animation = 'blink-caret 0.75s step-end infinite';

            finalMsg.appendChild(typingLine);
            messageBox.appendChild(finalMsg);

            // Pesan final dengan kata-kata kocak tukang sayur
            const finalPesan = "Cukup! Kalau masih galau mikirin masa lalu, nanti aku kasih notifikasi spam tiap menit! Jangan galau sama Mas-mas tukang sayur dikasih seragam, Sayang! Dah, I love you, Pasukan Anti-Kalah! 💪😂";
            let finalIndex = 0;

            function typeFinal() {
                if (finalIndex < finalPesan.length) {
                    typingLine.textContent += finalPesan.charAt(finalIndex);
                    finalIndex++;
                    setTimeout(typeFinal, 50);
                } else {
                    typingLine.classList.remove('typing-line');
                    typingLine.style.borderRight = 'none'; 
                    typingLine.style.animation = 'none';
                    finalMsg.textContent = finalPesan; 
                    button.textContent = "Siap, Boss! 😂";
                    button.disabled = true;
                    button.style.backgroundColor = '#4CAF50';
                }
            }
            typeFinal();
        }

        // --- Logika Animasi Hati ---
        function createHeart() {
            const heart = document.createElement('i');
            heart.classList.add('fas', 'fa-heart', 'heart');
            document.body.appendChild(heart);

            heart.style.left = Math.random() * 100 + 'vw'; /* Posisi horizontal acak */
            heart.style.animationDuration = Math.random() * 5 + 5 + 's'; /* Durasi acak 5-10 detik */
            heart.style.fontSize = Math.random() * 1 + 1 + 'rem'; /* Ukuran acak 1-2 rem */
            heart.style.opacity = Math.random() * 0.5 + 0.3; /* Opacity acak */

            // Hapus hati setelah animasi selesai
            heart.addEventListener('animationend', () => {
                heart.remove();
            });
        }

        // Panggil fungsi createHeart setiap beberapa waktu
        setInterval(createHeart, 300); /* Setiap 300ms, munculkan hati baru */

        document.addEventListener('DOMContentLoaded', () => {
            typeWriter();
        });
    </script>
</body>
</html>
