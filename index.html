<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner In Crime: Pasukan Anti-Kalah</title>
    <!-- Memuat ikon hati (dari FontAwesome, library gratis) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Menggunakan font Poppins yang lebih elegan */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            /* Gradient soft peach dan pink */
            background: linear-gradient(135deg, #ffdde1 0%, #ffc0cb 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden; /* Mencegah scroll yang tidak perlu */
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95); /* Sedikit transparan */
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.4); /* Shadow pink yang lembut */
            max-width: 90vw;
            /* PERBAIKAN 1: Perbesar container jadi 650px */
            width: 650px; 
            transition: all 0.5s ease;
            border: 2px solid #ff69b4; /* Garis tepi pink */
        }

        header h1 {
            color: #d33c7c; /* Pink gelap yang elegan */
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        header p {
            color: #888;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .message-box {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border-radius: 15px;
            background: #fff0f5; /* Background sangat soft pink */
            margin-bottom: 25px;
        }

        /* PERBAIKAN CSS di sini */
        .typing-text {
            color: #4b0082; /* Ungu indigo yang kontras */
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.7;
            min-height: 40px;
            border-right: 3px solid #ff69b4; 
            overflow: hidden;
            width: 100%; 
            margin: 10px 0;
            padding-right: 5px;
            text-align: center;
        }

        .typing-line {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap; /* Hanya berlaku untuk baris yang sedang diketik */
            border-right: 3px solid #ff69b4;
            animation: blink-caret 0.75s step-end infinite;
            max-width: 100%; 
        }
        
        .hidden {
            opacity: 0;
            transition: opacity 1s ease;
            height: 0;
        }
        
        /* Gaya Tombol Semangat */
        .cta-button {
            background-color: #ff69b4; /* Hot Pink */
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.6);
            margin-top: 15px;
        }

        .cta-button:hover {
            background-color: #d33c7c;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.8);
        }

        /* Animasi cursor mengetik */
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #ff69b4; }
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
                /* Kecilkan lebar di mobile */
                width: 90vw; 
            }
            header h1 {
                font-size: 1.8rem;
            }
            .typing-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pasukan Anti-Kalah 🤣</h1>
            <p>Pesan ini dibuat khusus untuk kamu, Partner In Crime-ku!</p>
        </header>
        
        <div class="message-box">
            <!-- Tempat Pesan-pesan akan muncul bergantian -->
            <p id="msg1" class="typing-text"></p>
            <p id="msg2" class="typing-text hidden"></p>
            <p id="msg3" class="typing-text hidden"></p>
        </div>

        <button class="cta-button" onclick="showFinalMessage()">
            <i class="fas fa-laugh-squint"></i> Klik Untuk Tambahan Semangat!
        </button>

        <footer>
            <p style="color: #a0a0a0; font-weight: 300; margin-top: 30px; font-size: 0.9rem;">
                Dibuat oleh *sidekick*-mu, yang siap *back-up* kapan saja.
            </p>
        </footer>
    </div>

    <script>
        // Pesan-pesan penyemangat yang akan muncul secara bergantian
        const messages = [
            "Stop! HP kamu terdeteksi sedang galau, dan itu bukan karena *password* Wi-Fi! 😠",
            "Mantan itu cuma *trailer* film yang udah *flop*, Sayang. Kenapa nonton *trailer* terus kalau *movie* utama kita baru mau tayang?",
            "Yuk, balik badan! Fokus ke *upgrade* diri. Yang terbaik itu ada di depan, bukan di riwayat *chat* yang lalu. Aku di sini lho!",
        ];

        const messageElements = [
            document.getElementById('msg1'),
            document.getElementById('msg2'),
            document.getElementById('msg3'),
        ];

        let messageIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (messageIndex < messages.length) {
                const currentMessage = messages[messageIndex];
                const currentElement = messageElements[messageIndex];
                
                // Tambahkan span khusus untuk efek mengetik dan kursor
                if (!currentElement.querySelector('.typing-line')) {
                    currentElement.innerHTML = '<span class="typing-line"></span>';
                }
                const typingLine = currentElement.querySelector('.typing-line');
                
                if (charIndex < currentMessage.length) {
                    currentElement.classList.remove('hidden');
                    
                    typingLine.textContent += currentMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 40); // Kecepatan mengetik: 40ms
                } else {
                    // Setelah selesai, hapus efek mengetik/kursor agar bisa wrapping normal
                    typingLine.classList.remove('typing-line');
                    typingLine.style.borderRight = 'none';
                    typingLine.style.animation = 'none';

                    // Pindahkan semua konten kembali ke elemen utama (tanpa span)
                    currentElement.textContent = currentMessage; 
                    
                    charIndex = 0;
                    messageIndex++;
                    
                    // Jeda sebentar sebelum memulai pesan berikutnya
                    if (messageIndex < messages.length) {
                        setTimeout(() => {
                            typeWriter();
                        }, 1800); // Jeda 1.8 detik
                    }
                }
            }
        }

        // Fungsi yang dipanggil saat tombol Peluk Virtual diklik
        function showFinalMessage() {
            const button = document.querySelector('.cta-button');
            const messageBox = document.querySelector('.message-box');
            
            // Hapus pesan lama
            messageBox.innerHTML = ''; 

            const finalMsg = document.createElement('p');
            finalMsg.className = 'typing-text';

            const typingLine = document.createElement('span');
            typingLine.className = 'typing-line';
            typingLine.style.borderRight = '3px solid #ff69b4';
            typingLine.style.animation = 'blink-caret 0.75s step-end infinite';

            finalMsg.appendChild(typingLine);
            messageBox.appendChild(finalMsg);

            // PERBAIKAN 2: Tambahkan kalimat tentang tukang sayur
            const finalPesan = "Cukup! Kalau masih galau mikirin masa lalu, nanti aku kasih notifikasi spam tiap menit! Jangan galau sama Mas-mas tukang sayur dikasih seragam, Sayang! Dah, I love you, Pasukan Anti-Kalah! 💪😂";
            let finalIndex = 0;

            function typeFinal() {
                if (finalIndex < finalPesan.length) {
                    typingLine.textContent += finalPesan.charAt(finalIndex);
                    finalIndex++;
                    setTimeout(typeFinal, 50);
                } else {
                    typingLine.classList.remove('typing-line');
                    typingLine.style.borderRight = 'none'; // Matikan cursor setelah selesai
                    typingLine.style.animation = 'none';
                    finalMsg.textContent = finalPesan; // Pastikan teks penuh tampil dan wrapping
                    button.textContent = "Siap, Boss! 😂";
                    button.disabled = true;
                    button.style.backgroundColor = '#4CAF50';
                }
            }
            typeFinal();
        }

        // Jalankan fungsi setelah semua elemen dimuat
        document.addEventListener('DOMContentLoaded', () => {
            typeWriter();
        });
    </script>
</body>
</html>
