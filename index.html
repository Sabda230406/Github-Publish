<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Mayomi: SEMANGATTT! ❤️</title>
    <!-- Memuat ikon FontAwesome untuk hati --><script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Menggunakan font Poppins yang modern dan bersih */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            /* Background kertas buku/diary (beige dengan garis) */
            background-color: #f8f0e3; 
            background-image: repeating-linear-gradient(
                0deg,
                #f5e8d5,
                #f5e8d5 1px,
                #f8f0e3 1px,
                #f8f0e3 30px /* Jarak antar garis (simulasi baris buku) */
            );
            color: #1e3d59; /* Warna tinta */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden; 
            position: relative;
        }

        /* PERBAIKAN: Hanya mengatur lebar dan centering untuk semua konten, tanpa visual card */
        .main-content {
            max-width: 90vw;
            width: 700px; /* Diperbesar sedikit agar lebih nyaman di layar kertas */
            transition: all 0.5s ease;
            z-index: 10;
            position: relative;
            padding: 40px 20px; 
        }

        header h1 {
            color: #d81b60; /* Pink gelap yang romantis */
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 5px rgba(0,0,0,0.1); 
            padding: 10px 0; 
            display: block; 
        }

        header p {
            color: #444; 
            font-weight: 600;
            margin-bottom: 30px;
            font-style: italic;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8); 
        }

        .message-box {
            min-height: 200px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin-bottom: 25px;
        }

        .typing-text {
            color: #1e3d59; /* Warna tinta deep blue */
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.8;
            min-height: 40px;
            border-right: 3px solid #ff69b4; /* Kursor mengetik */
            overflow: hidden;
            width: 100%; 
            margin: 10px 0;
            padding: 0; 
            background-color: transparent; 
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.9); 
            text-align: center;
            /* Perubahan CSS untuk wrapping yang benar */
            white-space: normal; 
        }

        /* Class yang ditambahkan saat teks selesai diketik (untuk menghilangkan kursor) */
        .typed-done {
            border-right: none !important;
            animation: none !important;
        }
        
        .hidden {
            opacity: 0;
            transition: opacity 1s ease, height 1s ease;
            height: 0;
            overflow: hidden;
        }
        
        /* Gaya Tombol Semangat */
        .cta-button {
            background-color: #ff69b4; /* Hot Pink */
            color: white;
            border: none;
            padding: 15px 35px; 
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
            margin-top: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .cta-button:hover {
            background-color: #d33c7c;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.8);
        }

        footer {
            margin-top: 35px;
        }

        footer p {
            color: #666; 
            font-weight: 400;
            font-size: 0.9rem;
            border-top: none; 
            padding-top: 15px;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8); 
        }

        /* --- Animasi Hati UNGU --- */
        .heart {
            position: absolute;
            bottom: -20px; 
            font-size: 1.5rem;
            color: #a55eea; /* Ungu */
            animation: fly-up 10s linear infinite; 
            opacity: 0;
            pointer-events: none; 
            z-index: 5; 
        }

        @keyframes fly-up {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            80% {
                transform: translateY(-1000px) scale(1.5); 
                opacity: 0.8;
            }
            100% {
                transform: translateY(-1200px) scale(2);
                opacity: 0;
            }
        }

        /* Animasi cursor mengetik */
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #ff69b4; }
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 600px) {
            .main-content {
                padding: 25px;
                width: 95vw; 
            }
            header h1 {
                font-size: 2rem;
            }
            .typing-text {
                font-size: 1.1rem;
            }
            .cta-button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <header>
            <h1>SEMANGAT MAYOMIII! <i class="fas fa-heart" style="color:#ff69b4;"></i></h1>
            <p>Pesan ini dibuat khusus untuk kamu, Kekuatan Hatiku.</p>
        </header>
        
        <div class="message-box">
            <p id="msg1" class="typing-text"></p>
            <p id="msg2" class="typing-text hidden"></p>
            <p id="msg3" class="typing-text hidden"></p>
        </div>

        <button class="cta-button" onclick="showFinalMessage()">
            <i class="fas fa-laugh-squint"></i> Klik Untuk Tambahan Semangat!
        </button>

        <footer>
            <p>Dibuat oleh orang yang hatinya selalu bersamamu.</p>
        </footer>
    </div>

    <script>
        // Pesan-pesan penyemangat yang akan muncul secara bergantian (KOCAK/LUCU)
        const messages = [
            "Hei! Stop *scroll* media sosial! Mantan itu kayak iklan *pop-up* di internet, harus di-blokir, bukan di-klik!",
            "Wajah kamu itu terlalu *Cantik* untuk dipakai galau dan nangis. Kenapa fokus ke *ending* film yang udah kamu tonton, mending *spill* *season* barunya sama cowok baik di luar sana yang masih mau nerima kamu apa adanya!",
            "Tugas kamu sekarang cuma dua: ketawa 7 kali sehari, dan ingat, *level* kegalauan mantanmu itu udah *discontinued*. Kita udah *update* ke *versi* yang lebih keren!",
        ];

        const messageElements = [
            document.getElementById('msg1'),
            document.getElementById('msg2'),
            document.getElementById('msg3'),
        ];

        let messageIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (messageIndex < messages.length) {
                const currentMessage = messages[messageIndex];
                const currentElement = messageElements[messageIndex];
                
                if (charIndex < currentMessage.length) {
                    currentElement.classList.remove('hidden', 'typed-done');
                    
                    // Langsung append karakter. Browser otomatis handle wrapping.
                    currentElement.textContent += currentMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 30); 
                } else {
                    // Teks selesai, hapus kursor
                    currentElement.classList.add('typed-done'); 
                    
                    charIndex = 0;
                    messageIndex++;
                    
                    // Jeda antar-pesan dipersingkat (1000ms)
                    if (messageIndex < messages.length) {
                        setTimeout(() => {
                            typeWriter();
                        }, 1000); 
                    }
                }
            }
        }

        function showFinalMessage() {
            const button = document.querySelector('.cta-button');
            const messageBox = document.querySelector('.message-box');
            
            messageBox.innerHTML = ''; 

            const finalMsg = document.createElement('p');
            finalMsg.className = 'typing-text';
            messageBox.appendChild(finalMsg);

            // PESAN FINAL BARU DENGAN SANGKUT PAUT MANTAN
            const finalPesan = "Jangan mikirin mantanmu terus, Sayang! Abuyy dia itu kayak mas-mas tukang sayur dikasih seragam aja. Jadi, fokus ke depan! Ada aku yang selalu nemenin kamu ketika kamu butuh cerita ya, Omayyy! Aku mencintaimu, Pasukan Anti-Galau! 💪😂";
            let finalIndex = 0;

            function typeFinal() {
                if (finalIndex < finalPesan.length) {
                    finalMsg.classList.remove('typed-done'); // Pastikan kursor aktif
                    finalMsg.textContent += finalPesan.charAt(finalIndex);
                    finalIndex++;
                    setTimeout(typeFinal, 50);
                } else {
                    finalMsg.classList.add('typed-done'); // Hapus kursor
                    button.textContent = "Berhasil *Move On*! 😂";
                    button.disabled = true;
                    button.style.backgroundColor = '#4CAF50'; // Warna hijau semangat
                }
            }
            typeFinal();
        }

        // --- Logika Animasi Hati ---
        function createHeart() {
            const heart = document.createElement('i');
            heart.classList.add('fas', 'fa-heart', 'heart');
            document.body.appendChild(heart);

            heart.style.left = Math.random() * 100 + 'vw'; /* Posisi horizontal acak */
            heart.style.animationDuration = Math.random() * 5 + 5 + 's'; /* Durasi acak 5-10 detik */
            heart.style.fontSize = Math.random() * 1 + 1 + 'rem'; /* Ukuran acak 1-2 rem */
            heart.style.opacity = Math.random() * 0.5 + 0.3; /* Opacity acak */

            // Hapus hati setelah animasi selesai
            heart.addEventListener('animationend', () => {
                heart.remove();
            });
        }

        setInterval(createHeart, 300); 

        document.addEventListener('DOMContentLoaded', () => {
            typeWriter();
        });
    </script>
</body>
</html>
